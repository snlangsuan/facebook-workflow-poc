name: Deploy API

on:
  # Auto-run: every push to main deploys automatically (target resolved in the setup job).
  push:
    branches:
      - main
  # Manual run: still available for on-demand deploys to a chosen environment.
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - prod
      reason:
        description: 'Reason for deployment'
        required: false
        type: string

run-name: Deploy by @${{ github.actor }} - ${{ inputs.reason || github.event.head_commit.message || github.sha }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api
  CONTAINER_NAME: omni-api

jobs:
  # Resolve the deploy target once so both build and deploy share it. A manual run uses
  # the chosen input; an automatic push has no input, so it defaults by branch.
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve deploy target
        id: resolve
        shell: bash
        run: |
          TARGET="${{ inputs.deploy_target }}"
          if [ -z "$TARGET" ]; then
            # Automatic (push) run: main -> prod, any other branch -> dev.
            if [ "${{ github.ref_name }}" = "main" ]; then
              TARGET="prod"
            else
              TARGET="dev"
            fi
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Resolved deploy target: $TARGET"

  build:
    needs: setup
    runs-on: ubuntu-22.04
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Dockerfile copies .env into the image, so we materialise it from
      # secrets here in the build context before building.
      - name: Create env file from secrets
        shell: bash
        run: |
          touch .env
          echo "NODE_ENV=${NODE_ENV:-production}" >> .env
          echo "HOST=${HOST:-0.0.0.0}" >> .env
          echo "PORT=${PORT:-8000}" >> .env
          echo "BASE_URL=${BASE_URL}" >> .env
          echo "GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}" >> .env
          echo "GOOGLE_LOCATION=${GOOGLE_LOCATION:-us-central1}" >> .env
          echo "GOOGLE_AUTH_CLIENT_EMAIL=${GOOGLE_AUTH_CLIENT_EMAIL}" >> .env
          echo "GOOGLE_AUTH_PRIVATE_KEY=\"${GOOGLE_AUTH_PRIVATE_KEY}\"" >> .env
          echo "FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}" >> .env
          echo "FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}" >> .env
          echo "FACEBOOK_APP_ID=${FACEBOOK_APP_ID}" >> .env
          echo "FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}" >> .env
          echo "FACEBOOK_VERIFY_TOKEN=${FACEBOOK_VERIFY_TOKEN}" >> .env
          echo "FACEBOOK_GRAPH_VERSION=${FACEBOOK_GRAPH_VERSION:-v25.0}" >> .env
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> .env
          echo "GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}" >> .env
        env:
          NODE_ENV: ${{ secrets.NODE_ENV }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          BASE_URL: ${{ secrets.BASE_URL }}
          GOOGLE_PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
          GOOGLE_LOCATION: ${{ secrets.GOOGLE_LOCATION }}
          GOOGLE_AUTH_CLIENT_EMAIL: ${{ secrets.GOOGLE_AUTH_CLIENT_EMAIL }}
          GOOGLE_AUTH_PRIVATE_KEY: ${{ secrets.GOOGLE_AUTH_PRIVATE_KEY }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
          FACEBOOK_VERIFY_TOKEN: ${{ secrets.FACEBOOK_VERIFY_TOKEN }}
          FACEBOOK_GRAPH_VERSION: ${{ secrets.FACEBOOK_GRAPH_VERSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.setup.outputs.target }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ needs.setup.outputs.target }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            sudo -iu ${{ secrets.TARGET_USER }} bash <<'EOF'
            set -euo pipefail
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.target }}"
            echo "Pulling Docker image from GHCR: ${IMAGE}"
            docker pull "${IMAGE}"

            echo 'Stopping and removing existing container...'
            docker stop ${{ env.CONTAINER_NAME }} 2> /dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2> /dev/null || true

            echo 'Starting new container...'
            PORT="${{ secrets.PORT || '8000' }}"
            docker run \
              --name "${{ env.CONTAINER_NAME }}" \
              --restart always \
              --add-host=host.docker.internal:host-gateway \
              -p "${PORT}:${PORT}" \
              --health-cmd="wget -qO- http://localhost:${PORT}/api/v1/health || exit 1" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=3 \
              -d "${IMAGE}"

            docker image prune -f
            docker ps
            EOF
